name: Publish release

# Builds the app and attaches the IPA to a GitHub Release. Install it with
# Sideloadly - "Publish Update.bat" can fetch it back down for you.
#
# Run it: Actions -> Publish release -> Run workflow -> type a version like 1.1

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.1)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SlimRead.xcodeproj \
            -scheme SlimRead \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ inputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package into an .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SlimRead.app Payload/
          zip -qry SlimRead.ipa Payload
          ls -lh SlimRead.ipa

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" SlimRead.ipa \
            --title "SlimRead ${{ inputs.version }}" \
            --notes "Automated build of ${{ github.sha }}" \
            --latest
