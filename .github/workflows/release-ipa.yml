name: Publish release

# Builds the app and attaches the IPA to a GitHub Release. Install it with
# Sideloadly - "Publish Update.bat" can fetch it back down for you.
#
# Run it: Actions -> Publish release -> Run workflow -> type a version like 1.1

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.1)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the changelog below can look back to the last tag

      # Writes the notes to a FILE, and reads inputs from the environment rather
      # than letting ${{ }} expand inside the script.
      #
      # Actions substitutes ${{ }} textually into the shell, so a changelog entry
      # containing a double quote - "near the end" - closed the --notes string and
      # the remaining words became arguments. gh then looked for assets by those
      # names and failed with: no matches found for `the`. A file has no quoting
      # to get wrong, and env vars are never re-parsed as script.
      - name: Build the changelog
        env:
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          prev=$(git describe --tags --abbrev=0 --exclude "v$VERSION" 2>/dev/null || true)
          {
            # Prefer the hand-written section in CHANGELOG.md - it says what the
            # version actually does. Commit subjects are the fallback.
            section=$(awk -v v="## v$VERSION" '$0 ~ "^" v {flag=1; next} /^## /{if(flag) exit} flag' CHANGELOG.md 2>/dev/null || true)
            if [ -n "$(echo "$section" | tr -d '[:space:]')" ]; then
              echo "### What changed"
              echo "$section"
            elif [ -n "$prev" ]; then
              echo "### Changes since $prev"
              echo ""
              git log --no-merges --pretty='- %s' "$prev"..HEAD
            else
              echo "### Changes"
              echo ""
              git log --no-merges --pretty='- %s' -n 20
            fi

            echo ""
            echo "Build $RUN_NUMBER of $SHA"
          } > release-notes.md

          echo "--- release notes ---"
          cat release-notes.md

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SlimRead.xcodeproj \
            -scheme SlimRead \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ inputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package into an .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SlimRead.app Payload/
          zip -qry SlimRead.ipa Payload
          ls -lh SlimRead.ipa

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" SlimRead.ipa \
            --title "SlimRead $VERSION" \
            --notes-file release-notes.md \
            --latest
