name: Publish release

# Builds the app, attaches the IPA to a GitHub Release, and refreshes source.json
# so AltStore/SideStore on the phone sees the update and can install it with one tap.
#
# Run it: Actions -> Publish release -> Run workflow -> type a version like 1.1

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.1)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SlimRead.xcodeproj \
            -scheme SlimRead \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ inputs.version }} \
            build

      - name: Package into an .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SlimRead.app Payload/
          zip -qry SlimRead.ipa Payload
          echo "IPA_SIZE=$(stat -f%z SlimRead.ipa)" >> $GITHUB_ENV

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" SlimRead.ipa \
            --title "SlimRead ${{ inputs.version }}" \
            --notes "Automated build of ${{ github.sha }}" \
            --latest

      - name: Refresh source.json
        run: |
          python3 - <<'PY'
          import json, os, datetime

          version = os.environ['VERSION']
          size = int(os.environ['IPA_SIZE'])
          repo = os.environ['REPO']

          with open('source.json') as f:
              source = json.load(f)

          app = source['apps'][0]
          app['version'] = version
          app['versionDate'] = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          app['downloadURL'] = f'https://github.com/{repo}/releases/download/v{version}/SlimRead.ipa'
          app['size'] = size

          versions = app.setdefault('versions', [])
          versions.insert(0, {
              'version': version,
              'date': app['versionDate'],
              'downloadURL': app['downloadURL'],
              'size': size,
              'localizedDescription': f'SlimRead {version}'
          })
          app['versions'] = versions[:10]

          with open('source.json', 'w') as f:
              json.dump(source, f, indent=2)
              f.write('\n')
          PY
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}

      - name: Commit source.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Publish ${{ inputs.version }}" || echo "nothing to commit"
          git push
